_base_: ../base.yaml
model:
  name: damiano_unet
  trainer: native
  channels: [32, 64, 128, 256, 512, 1024]
  residual_units: 0
  in_channels: 1
  out_channels: 1
  options:
    loss: dice_plus
    dice_plus_gamma: 2.0
    dropout: 0.25
    inference: mcd
    inference_modes: [deterministic, mcd, tta]
    inference_samples: 20
    implementation: clean_room
optimizer:
  name: Adam
  learning_rate: 0.001
  weight_decay: 0.0
  epochs: 100
  batch_size: 8
runtime:
  run_name: damiano_mcd_plus
  checkpoint: student
