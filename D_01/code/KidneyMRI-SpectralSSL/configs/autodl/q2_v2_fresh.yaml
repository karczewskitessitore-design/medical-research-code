name: kidneyband_reliable_ssl_q2_v2_autodl_fresh_v1
schema_version: 2
output_root: /root/autodl-tmp/kidney/experiments/benchmarks
proposed_method: KidneyBand_ReliableSSL_v2

# These environment-only overrides replace Windows paths without changing any
# algorithm, loss, optimizer, seed, fold, or selection-rule definition.
config_overrides:
  data:
    root: /root/autodl-tmp/kidney/data/T2KidneyMRI
    manifest: /root/autodl-tmp/kidney/data/T2KidneyMRI/audit/manifest.csv
    folds: /root/autodl-tmp/kidney/data/T2KidneyMRI/splits/seed_20260802
  external_validation:
    manifests:
      chaos: /root/autodl-tmp/kidney/data/CHAOS/prepared/manifest.csv
      amos: /root/autodl-tmp/kidney/data/AMOS22/prepared/manifest.csv
  runtime:
    output_root: /root/autodl-tmp/kidney/experiments
    num_workers: 2
    resume: false

expected_subjects: 60
methods:
  - id: V2_B0plus
    config: ../v2/B0plus.yaml
    family: Optimized 2.5D U-Net
    phases: [screen, internal, external]
    external_reference: true
  - {id: V2_B0plus_5slice, config: ../v2/B0plus_5slice.yaml, family: Optimized 2.5D U-Net five-slice, phases: [screen]}
  - {id: V2_UABand, config: ../v2/UABand.yaml, family: UABand-HT, phases: [screen]}
  - {id: V2_CSD, config: ../v2/CSD.yaml, family: CSD-MT, phases: [screen]}
  - {id: V2_DZ, config: ../v2/DZ.yaml, family: DZ-BiMorph, phases: [screen]}
  - {id: V2_UABand_CSD, config: ../v2/UABand_CSD.yaml, family: UABand+CSD, phases: [screen]}
  - {id: V2_UABand_DZ, config: ../v2/UABand_DZ.yaml, family: UABand+DZ, phases: [screen]}
  - {id: V2_CSD_DZ, config: ../v2/CSD_DZ.yaml, family: CSD+DZ, phases: [screen]}
  - id: KidneyBand_ReliableSSL_v2
    config: ../v2/full.yaml
    family: KidneyBand-ReliableSSL v2
    phases: [screen, internal, external]
  - id: daniel_unet
    config: ../v2/baselines/daniel_unet.yaml
    family: Daniel-UNet
    journal: Magnetic Resonance in Medicine
    doi: 10.1002/mrm.28768
    license: clean-room reimplementation
    phases: [internal]
  - id: damiano_mcd_plus
    config: ../v2/baselines/damiano_mcd_plus.yaml
    family: Damiano-UNet/DicePlus
    journal: Medical Physics
    doi: 10.1002/mp.17995
    license: clean-room reimplementation
    phases: [internal]
  - id: nnunet_3d_default
    config: ../v2/baselines/nnunet_3d_default.yaml
    family: nnU-Net v2 3D full-resolution
    journal: Nature Methods
    doi: 10.1038/s41592-020-01008-z
    official_code: https://github.com/MIC-DKFZ/nnUNet
    license: Apache-2.0
    nnunet_official_3d: true
    external_reference: true
    phases: [internal, external]
  - id: unetpp
    config: ../v2/baselines/unetpp.yaml
    family: UNet++
    journal: IEEE Transactions on Medical Imaging
    doi: 10.1109/TMI.2019.2959609
    phases: [internal]
  - id: tcsm
    config: ../v2/baselines/tcsm.yaml
    family: TCSM
    journal: IEEE Transactions on Neural Networks and Learning Systems
    doi: 10.1109/TNNLS.2020.2995319
    strong_semisupervised: true
    phases: [internal]
  - id: cmmt
    config: ../v2/baselines/cmmt.yaml
    family: CMMT-Net
    journal: Medical Image Analysis
    doi: 10.1016/j.media.2024.103302
    strong_semisupervised: true
    phases: [internal]
  - id: frcnet
    config: ../v2/baselines/frcnet.yaml
    family: FRCNet
    venue: MICCAI 2024
    doi: 10.1007/978-3-031-72111-3_29
    strong_semisupervised: true
    phases: [internal]
  - id: semi_urf
    config: ../v2/baselines/semi_urf.yaml
    family: Semi-URF
    journal: IEEE Journal of Biomedical and Health Informatics
    doi: 10.1109/JBHI.2026.3690043
    official_code: https://github.com/senseiyang/Semi-URF
    strong_semisupervised: true
    external_reference: true
    phases: [internal, external]
  - id: randdg
    config: ../v2/baselines/randdg.yaml
    family: RandDG
    journal: Medical Physics
    doi: 10.1002/mp.70118
    external_reference: true
    phases: [internal, external]

phases:
  screen:
    split_seed: 20260802
    folds: [0, 1]
    seeds: [20260802]
  internal:
    split_seed: 20260803
    folds: [0, 1, 2, 3, 4]
    seeds: [20260811, 20260812, 20260813]
  external:
    datasets: [chaos_t2_spir, amos22_mri]
    ensemble_folds: [0, 1, 2, 3, 4]
    seeds: [20260811, 20260812, 20260813]

selection_rules:
  segmentation_min_dice_gain: 0.005
  segmentation_max_hd95_degradation_mm: 1.0
  repeat_min_wcv_gain_percent: 0.5
  repeat_max_dice_degradation: 0.005
  full_max_degradation_from_best_pair: 0.003

q2_gate:
  internal_min_dice: 0.88
  internal_min_effect: 0.01
  tkv_max_relative_error: 0.10
  repeat_max_wcv_percent: 4.0
  repeat_max_dice_tradeoff: 0.005
  external_noninferiority_margin: -0.01
  full_label_min_dice: 0.90
  bootstrap_draws: 10000
  permutation_draws: 100000
