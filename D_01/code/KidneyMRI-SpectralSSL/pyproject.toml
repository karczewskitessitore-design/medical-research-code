[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kidney-mri-spectral-ssl"
version = "0.1.0"
description = "Clean-room research implementation of label-efficient T2 kidney MRI segmentation"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "matplotlib>=3.9",
  "monai==1.6.0",
  "nibabel>=5.3",
  "numpy>=2.0",
  "pandas>=2.2",
  "pillow>=11.0",
  "pydicom>=3.0",
  "pyyaml>=6.0",
  "requests>=2.32",
  "scipy>=1.14",
  "torch==2.11.0",
  "torchvision==0.26.0",
  "tqdm>=4.67",
]

[project.optional-dependencies]
benchmark = ["nnunetv2==2.8.1"]

[project.scripts]
kidney-seg = "kidney_ssl.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.hatch.build.targets.wheel]
packages = ["src/kidney_ssl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
